# cpcd configuration for the AP's built-in IoT radio (install as /writable/data/bin/cpcd.conf).
# uart_device_file is the UART the radio is wired to; /dev/ttyMSM1 on the models tested so far.
instance_name: cpcd_0
bus_type: UART
uart_device_file: /dev/ttyMSM1
uart_device_baud: 115200
uart_hardflow: true
disable_encryption: true
bootloader_recovery_pins_enabled: false
trace_level: info
trace_to_file: false
