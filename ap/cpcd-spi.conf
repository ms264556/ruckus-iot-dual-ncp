# cpcd configuration for a radio on the AP's SPI: the R650's EFR32MG21 on /dev/spidev0.2 (install as
# /writable/data/bin/cpcd-spi.conf; iotd.conf's cpcd_conf names it). The hardware chip-select pad is not routed, so
# the chip select is a sysfs GPIO (gpio22); the radio's HOST_INT line is gpio55. 500 kHz: the AP's lines drop bits at
# 1 MHz. Needs the cpcd built by scripts/build-ap.sh (cpcd/0001-spi-software-chip-select-and-ap-fixes.patch).
instance_name: cpcd_0
bus_type: SPI
spi_device_file: /dev/spidev0.2
spi_rx_irq_gpio_chip: gpiochip0
spi_rx_irq_gpio: 55
spi_cs_gpio_chip: gpiochip0
spi_cs_gpio: 22
spi_device_bitrate: 500000
disable_encryption: true
bootloader_recovery_pins_enabled: false
trace_level: info
trace_to_file: false
